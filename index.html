function off(i){const a=i*137.508*Math.PI/180,r=.00020;return[Math.sin(a)*r,Math.cos(a)*r]}async function geo(q){const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=cl&q='+encodeURIComponent(q),{headers:{Accept:'application/json'}});if(!r.ok)throw Error();const j=await r.json();return j[0]||null}async function cargarBases(){const cache={},cont={};for(const [n,q] of bases){try{let g=cache[q];if(!g){g=await geo(q);cache[q]=g}if(g){const k=cont[q]||0;cont[q]=k+1;const d=off(k);L.marker([+g.lat+d[0],+g.lon+d[1]],{icon:icon(n,'base-label'),zIndexOffset:1000}).bindPopup('<b>Base SAMU '+n+'</b>').addTo(basesLayer)}}catch(e){console.warn('Sin geocodificación:',n,q)}await new Promise(r=>setTimeout(r,1100))}}cargarBases();
